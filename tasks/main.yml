# tasks file
---
- name: install
  ansible.builtin.apt:
    name: "{{ rsyslog_dependencies }}"
    state: "{{ apt_install_state | default('latest') }}"
    update_cache: true
    cache_valid_time: "{{ apt_update_cache_valid_time | default(3600) }}"
  tags:
    - configuration
    - rsyslog
    - rsyslog-install

# workaround for: https://bugs.launchpad.net/ubuntu/+source/rsyslog/+bug/1256695/comments/5
- name: fix dir permissions
  ansible.builtin.file:
    path: /var/log
    owner: "{{ rsyslog_var_log_user }}"
    group: "{{ rsyslog_var_log_group }}"
    mode: "{{ rsyslog_var_log_mode }}"
  tags:
    - configuration
    - rsyslog
    - rsyslog-configuration
    - rsyslog-configuration-permissions

- name: apparmor | complain
  ansible.builtin.command: >
    aa-complain /etc/apparmor.d/usr.sbin.rsyslogd
  failed_when: false
  changed_when: false
  tags:
    - configuration
    - rsyslog
    - rsyslog-configuration
    - rsyslog-configuration-apparmor
    - rsyslog-configuration-apparmor-complain

- name: update specific configuration files
  ansible.builtin.template:
    src: etc/rsyslog.d/rsyslog.conf.j2
    dest: "/etc/rsyslog.d/{{ item.key }}.conf"
    validate: "{{ 'rsyslogd -N1 -f %s' if item.value.validate | default(true) else 'true %s' }}"
    owner: root
    group: root
    mode: 0440
  with_dict: "{{ rsyslog_rsyslog_d_files }}"
  when: item.value.state | default('present') == 'present'
  notify: restart rsyslog
  tags:
    - configuration
    - rsyslog
    - rsyslog-configuration
    - rsyslog-configuration-rsyslog-d

- name: remove configurations
  ansible.builtin.file:
    dest: "/etc/rsyslog.d/{{ item.key }}.conf"
    state: absent
  with_dict: "{{ rsyslog_rsyslog_d_files }}"
  when: item.value.state | default('present') == 'absent'
  notify: restart rsyslog
  tags:
    - configuration
    - rsyslog
    - rsyslog-configuration
    - rsyslog-configuration-rsyslog-d

- name: stat global configuration file
  ansible.builtin.stat:
    path: "{{ rsyslog_global_config_file }}"
  register: _stat_result
  tags:
    - configuration
    - rsyslog
    - rsyslog-configuration
    - rsyslog-configuration-rsyslog

- name: update global configuration file
  ansible.builtin.template:
    src: "{{ rsyslog_global_config_file.lstrip('/') }}.j2"
    dest: "{{ rsyslog_global_config_file_tmp }}"
    owner: root
    group: root
    mode: 0440
  register: _update_result
  changed_when: false
  tags:
    - configuration
    - rsyslog
    - rsyslog-configuration
    - rsyslog-configuration-rsyslog

- name: validate global configuration file
  ansible.builtin.command: >
    rsyslogd -N1 -f {{ rsyslog_global_config_file_tmp }}
  register: _validate_result
  changed_when: false
  failed_when: _validate_result.rc != 0
  tags:
    - configuration
    - rsyslog
    - rsyslog-configuration
    - rsyslog-configuration-rsyslog
    - rsyslog-configuration-rsyslog-validation

- name: use global configuration file
  ansible.builtin.command: >
    mv {{ rsyslog_global_config_file_tmp }} {{ rsyslog_global_config_file }}
  changed_when: _stat_result.stat.checksum != _update_result.checksum
  notify: restart rsyslog
  tags:
    - configuration
    - rsyslog
    - rsyslog-configuration
    - rsyslog-configuration-rsyslog
    - rsyslog-configuration-rsyslog-use

- name: apparmor | enforce
  ansible.builtin.command: >
    aa-enforce  /etc/apparmor.d/usr.sbin.rsyslogd
  failed_when: false
  changed_when: false
  tags:
    - configuration
    - rsyslog
    - rsyslog-configuration
    - rsyslog-configuration-apparmor
    - rsyslog-configuration-apparmor-enforce

- name: start and enable service
  ansible.builtin.service:
    name: rsyslog
    state: "{{ service_default_state | default('started') }}"
    enabled: "{{ service_default_enabled | default(true) | bool }}"
  tags:
    - configuration
    - rsyslog
    - rsyslog-start-enable-service
