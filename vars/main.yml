# vars file
---
rsyslog_dependencies:
  - rsyslog
  - rsync
rsyslog_user: "{{ 'syslog' if ansible_facts['distribution'] == 'Ubuntu' else 'root' }}"
rsyslog_group: adm

rsyslog_var_log_user: root
rsyslog_var_log_group: "{{ rsyslog_user }}"
rsyslog_var_log_mode: "{{ '0775' if ansible_facts['distribution'] == 'Ubuntu' else '0755' }}"

rsyslog_global_config_file: /etc/rsyslog.conf
rsyslog_global_config_file_tmp: "{{ rsyslog_global_config_file | replace('etc', 'tmp') }}"

rsyslog_apparmor_profile: /etc/apparmor.d/usr.sbin.rsyslogd
rsyslog_apparmor_profile_local: /etc/apparmor.d/local/usr.sbin.rsyslogd
